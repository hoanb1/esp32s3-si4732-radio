profiles:
  # Classic ESP32-D0WD-V3 board
  classic:
    # If you change this line, change it in build.yml as well
    fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
    platforms:
      - platform: esp32:esp32 (3.3.1)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - PU2CLR SI4735 (2.1.8)
      - TFT_eSPI (2.5.43)
      - Async TCP (3.5.0)
      - ESP Async WebServer (3.12.1)
      - NTPClient (3.2.1)
      - Etherkit Si5351 (2.2.0)
      - dir: ../libraries/ft8_lib

  # V3S board: ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM)
  v3s:
    # If you change this line, change it in build.yml as well
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,PSRAM=opi,FlashSize=16M,FlashMode=qio,PartitionScheme=custom,DebugLevel=none
    platforms:
      - platform: esp32:esp32 (3.3.1)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - PU2CLR SI4735 (2.1.8)
      - TFT_eSPI (2.5.43)
      - Async TCP (3.5.0)
      - ESP Async WebServer (3.12.1)
      - NTPClient (3.2.1)
      - Etherkit Si5351 (2.2.0)
      - dir: ../libraries/ft8_lib

default_profile: classic
